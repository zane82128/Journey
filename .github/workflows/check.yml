name: Check
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:artifact
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          TEST_BASE_PATH: /Journey/
      - uses: actions/upload-artifact@v4
        with:
          name: verified-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
